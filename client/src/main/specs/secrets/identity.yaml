name: Identity
category: secrets
mountable: false
basePath: identity

operations:

###############################################################################
# ENTITY
###############################################################################

- name: createOrUpdateEntity
  method: POST
  path: entity
  parameters:
  - name: params
    type: java.util.Map<String,Object>
    body: true
  result:
    kind: leased
    unwrapData: true
    dataType: $EntityIdAliasesResult


- name: updateEntityById
  method: POST
  path: entity/id/:id
  parameters:
  - name: id
    type: String
  - name: params
    type: java.util.Map<String,Object>
    body: true


- name: readEntity
  method: GET
  path: entity/id/:id
  parameters:
  - name: id
    type: String
  result:
    kind: leased
    unwrapData: true
    dataType: $EntityData


- name: deleteEntity
  method: DELETE
  path: entity/id/:id
  parameters:
  - name: id
    type: String


- name: listEntities
  method: GET
  path: entity/id
  queryFrom: [list]
  parameters:
    - name: list
      type: Boolean
  result:
    kind: leased
    unwrappedType: java.util.List<String>
    unwrapUsing: r.getData().getKeys()
    dataType: $ListResultData


###############################################################################
# ENTITY BY NAME
###############################################################################

- name: createOrUpdateEntityByName
