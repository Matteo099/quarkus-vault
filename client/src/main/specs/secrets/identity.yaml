###############################################################################
# TYPES
###############################################################################

types:

###############################################################################
# LOW LEVEL TYPES FIRST (NO DEPENDENCIES)
###############################################################################

- name: EntityAliasKeyInfo
  properties:
  - name: canonical_id
    type: String
  - name: name
    type: String
  - name: mount_accessor
    type: String
  - name: mount_path
    type: String
  - name: mount_type
    type: String
  - name: local
    type: Boolean
  - name: custom_metadata
    type: java.util.Map<String,String>


- name: EntityAliasData
  properties:
  - name: id
    type: String
  - name: name
    type: String
  - name: canonical_id
    type: String
  - name: mount_accessor
    type: String
  - name: mount_path
    type: String
  - name: mount_type
    type: String
  - name: local
    type: Boolean
  - name: metadata
    type: java.util.Map<String,String>
  - name: custom_metadata
    type: java.util.Map<String,String>
  - name: creation_time
    type: String
  - name: last_update_time
    type: String


###############################################################################
# MID LEVEL TYPES
###############################################################################

- name: EntityAliasListData
  properties:
  - name: keys
    type: java.util.List<String>
  - name: key_info
    type: java.util.Map<String,$EntityAliasKeyInfo>


- name: EntityData
  properties:
  - name: id
    type: String
  - name: name
    type: String
  - name: policies
    type: java.util.List<String>
  - name: group_ids
    type: java.util.List<String>
  - name: metadata
    type: java.util.Map<String,String>
  - name: disabled
    type: Boolean
  - name: aliases
    type: java.util.List<$EntityAliasData>
  - name: creation_time
    type: String
  - name: last_update_time
    type: String


- name: GroupData
  properties:
  - name: id
    type: String
  - name: name
    type: String
  - name: type
    type: String
  - name: policies
    type: java.util.List<String>
  - name: member_entity_ids
    type: java.util.List<String>
  - name: member_group_ids
    type: java.util.List<String>
  - name: parent_group_ids
    type: java.util.List<String>
  - name: metadata
    type: java.util.Map<String,String>
  - name: creation_time
    type: String
  - name: last_update_time
    type: String
  - name: modify_index
    type: Long
  - name: alias
    type: java.util.Map<String,Object>


- name: GroupAliasData
  properties:
  - name: id
    type: String
  - name: name
    type: String
  - name: canonical_id
    type: String
  - name: mount_accessor
    type: String
  - name: mount_path
    type: String
  - name: mount_type
    type: String
  - name: creation_time
    type: String
  - name: last_update_time
    type: String
  - name: merged_from_canonical_ids
    type: java.util.List<String>
  - name: metadata
    type: java.util.Map<String,String>


###############################################################################
# RESULT WRAPPERS LAST
###############################################################################

- name: EntityIdAliasesResult
  properties:
  - name: id
    type: String
  - name: aliases
    type: java.util.List<$EntityAliasData>

- name: IdNameResult
  properties:
  - name: id
    type: String
  - name: name
    type: String

- name: AliasCreateResult
  properties:
  - name: id
    type: String
  - name: canonical_id
    type: String

- name: ListResultData
  properties:
  - name: keys
    type: java.util.List<String>
