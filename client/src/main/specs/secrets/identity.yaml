- name: batchDeleteEntities
  method: POST
  path: entity/batch-delete
  parameters:
  - name: entity_ids
    type: java.util.List<String>
    body: true


- name: mergeEntities
  method: POST
  path: entity/merge
  parameters:
  - name: params
    type: java.util.Map<String,Object>
    body: true


